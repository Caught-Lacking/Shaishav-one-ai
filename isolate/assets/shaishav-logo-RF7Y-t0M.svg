<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 372" width="512" height="372" role="img" aria-label="Shaishav One AI logo">
  <defs>
    <linearGradient id="goldFan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a5a00"/>
      <stop offset="45%" stop-color="#e0a82e"/>
      <stop offset="70%" stop-color="#ffd25c"/>
      <stop offset="100%" stop-color="#fff3c4"/>
    </linearGradient>
    <linearGradient id="goldFanDark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5c3a00"/>
      <stop offset="55%" stop-color="#a97b17"/>
      <stop offset="100%" stop-color="#e0b04a"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b9841a"/>
      <stop offset="50%" stop-color="#ffd860"/>
      <stop offset="100%" stop-color="#fffbe6"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0.1" x2="0" y2="0.95">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd25c"/>
      <stop offset="75%" stop-color="#d99f22"/>
      <stop offset="100%" stop-color="#8a5a00"/>
    </linearGradient>
    <linearGradient id="peacockBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d7bfa"/>
      <stop offset="45%" stop-color="#3449cf"/>
      <stop offset="100%" stop-color="#1b2793"/>
    </linearGradient>
    <filter id="emblemShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0b0f38" flood-opacity="0.45"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0b0f38" flood-opacity="0.6"/>
    </filter>
    <!-- Single gold petal pointing up from origin -->
    <g id="petal">
      <path d="M0,2 C-17,-28 -11,-64 0,-94 C11,-64 17,-28 0,2 Z" fill="url(#goldFanDark)" stroke="#4d3400" stroke-width="1.4"/>
      <path d="M0,0 C-9,-22 -6,-48 0,-72 C6,-48 9,-22 0,0 Z" fill="url(#goldFan)" opacity="0.9"/>
      <path d="M0,-10 C-3,-24 -2,-38 0,-50 C2,-38 3,-24 0,-10 Z" fill="url(#goldBright)" opacity="0.85"/>
    </g>
    <g id="peacockHead">
      <!-- neck -->
      <path d="M245,166 C241,146 243,128 249,117 L263,117 C269,128 271,146 267,166 C259,170 253,170 245,166 Z" fill="url(#peacockBlue)" stroke="#141e78" stroke-width="1.6"/>
      <!-- head -->
      <circle cx="256" cy="102" r="16.5" fill="url(#peacockBlue)" stroke="#141e78" stroke-width="1.6"/>
      <!-- crest -->
      <path d="M256,87 C252,76 244,70 236,66" stroke="#5d7bfa" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M258,87 C259,74 262,65 266,58" stroke="#3449cf" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M260,88 C266,78 274,72 282,68" stroke="#5d7bfa" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <!-- beak (pointing right) -->
      <path d="M271,100 L289,104 L271,108 Z" fill="#e9c24b" stroke="#8a5a00" stroke-width="1.2"/>
      <!-- eye -->
      <circle cx="262" cy="99" r="2.6" fill="#0b1030"/>
      <circle cx="262.8" cy="98.3" r="0.9" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Peacock fan emblem -->
  <g filter="url(#emblemShadow)">
    <g transform="translate(256,164)">
      <!-- back tier: wide fan -->
      <g>
        <use href="#petal" transform="rotate(-96) scale(1.02)"/>
        <use href="#petal" transform="rotate(-77) scale(1.06)"/>
        <use href="#petal" transform="rotate(-58) scale(1.1)"/>
        <use href="#petal" transform="rotate(-39) scale(1.13)"/>
        <use href="#petal" transform="rotate(-20) scale(1.15)"/>
        <use href="#petal" transform="rotate(-1) scale(1.16)"/>
        <use href="#petal" transform="rotate(18) scale(1.15)"/>
        <use href="#petal" transform="rotate(37) scale(1.13)"/>
        <use href="#petal" transform="rotate(56) scale(1.1)"/>
        <use href="#petal" transform="rotate(75) scale(1.06)"/>
        <use href="#petal" transform="rotate(94) scale(1.02)"/>
      </g>
      <!-- mid tier -->
      <g>
        <use href="#petal" transform="rotate(-68) scale(0.82)"/>
        <use href="#petal" transform="rotate(-51) scale(0.86)"/>
        <use href="#petal" transform="rotate(-34) scale(0.89)"/>
        <use href="#petal" transform="rotate(-17) scale(0.91)"/>
        <use href="#petal" transform="rotate(0) scale(0.92)"/>
        <use href="#petal" transform="rotate(17) scale(0.91)"/>
        <use href="#petal" transform="rotate(34) scale(0.89)"/>
        <use href="#petal" transform="rotate(51) scale(0.86)"/>
        <use href="#petal" transform="rotate(68) scale(0.82)"/>
      </g>
      <!-- front tier: bright center -->
      <g>
        <use href="#petal" transform="rotate(-26) scale(0.55)"/>
        <use href="#petal" transform="rotate(-13) scale(0.57)"/>
        <use href="#petal" transform="rotate(0) scale(0.58)"/>
        <use href="#petal" transform="rotate(13) scale(0.57)"/>
        <use href="#petal" transform="rotate(26) scale(0.55)"/>
      </g>
    </g>
    <!-- peacock head over the fan center -->
    <use href="#peacockHead" transform="translate(-0,0)"/>
  </g>

  <!-- SHAISHAV wordmark -->
  <g filter="url(#textShadow)">
    <text x="256" y="300" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="46" font-weight="bold" letter-spacing="8"
          fill="#241a02" transform="translate(0,3)">SHAISHAV</text>
    <text x="256" y="300" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="46" font-weight="bold" letter-spacing="8"
          fill="url(#goldText)" stroke="#6b4a00" stroke-width="1.4">SHAISHAV</text>
  </g>

  <!-- tagline -->
  <text x="256" y="338" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" letter-spacing="10"
        fill="#c9a64f" opacity="0.9">ONE AI</text>
</svg>
