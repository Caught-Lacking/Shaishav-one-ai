<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shaishav One AI logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#182552"/>
      <stop offset="55%" stop-color="#0d1430"/>
      <stop offset="100%" stop-color="#070b1d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#4b63d9" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4b63d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedb0"/>
      <stop offset="40%" stop-color="#f6c445"/>
      <stop offset="80%" stop-color="#d99f22"/>
      <stop offset="100%" stop-color="#a06b0e"/>
    </linearGradient>
    <linearGradient id="blueRing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f4fd6"/>
      <stop offset="50%" stop-color="#5f83ff"/>
      <stop offset="100%" stop-color="#9db8ff"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%" stop-color="#ffe9a3"/>
      <stop offset="55%" stop-color="#f7c94e"/>
      <stop offset="100%" stop-color="#c98a1e"/>
    </linearGradient>
    <linearGradient id="blueStripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fb0ff"/>
      <stop offset="100%" stop-color="#2b4ad1"/>
    </linearGradient>
    <filter id="emblemShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#04071a" flood-opacity="0.6"/>
    </filter>
    <filter id="ringShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#04071a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- gold arc: upper + right portions of the ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldRing)" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="519 549" transform="rotate(-135 256 256)" filter="url(#ringShadow)"/>
  <!-- blue crescent: lower-left, layered + extending outward -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#blueRing)" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="235 871" transform="rotate(212 256 256)" opacity="0.95"/>
  <circle cx="256" cy="256" r="163" fill="none" stroke="url(#blueRing)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="225 799" transform="rotate(208 256 256)" opacity="0.8"/>

  <!-- gold "1" with arrow point -->
  <g filter="url(#emblemShadow)">
    <path d="M222 148 L314 182 L240 214 Z" fill="url(#gold1)"/>
    <rect x="240" y="198" width="48" height="150" rx="10" fill="url(#gold1)"/>
    <rect x="273" y="198" width="15" height="150" rx="7" fill="#8a5a00" opacity="0.5"/>
  </g>

  <!-- blue diagonal stripe -->
  <g filter="url(#emblemShadow)">
    <path d="M356 196 L430 220 L402 308 L328 284 Z" fill="url(#blueStripe)"/>
  </g>

  <!-- gold sparkle -->
  <g filter="url(#emblemShadow)">
    <path d="M398 88 C403 104 410 111 426 116 C410 121 403 128 398 144 C393 128 386 121 370 116 C386 111 393 104 398 88 Z" fill="url(#gold1)"/>
  </g>
</svg>
